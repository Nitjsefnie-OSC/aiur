name: aiur fork CI

# Fork-only exact-ref validation. This file is intentionally not sent upstream.
on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Git branch, tag, or 40-character commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aiur-osc-manual-${{ github.repository }}-${{ inputs.target_ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: mix lint + LiveView test file + format
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout candidate ref
        uses: actions/checkout@v7
        with:
          repository: Nitjsefnie-OSC/aiur
          ref: ${{ inputs.target_ref }}
          persist-credentials: false

      - name: Report checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
            exit 1
          fi
          printf 'checked-out SHA: %s\n' "checked_out_sha=$checked_out_sha"

      - name: Setup Elixir (repository's own composite)
        uses: ./.github/actions/setup-elixir

      - name: Lint
        shell: bash
        working-directory: src
        run: mise exec -- mix lint

      - name: LiveView test file
        shell: bash
        working-directory: src
        run: mise exec -- mix test test/aiur_web/live/experiments_live_test.exs

      - name: Format check of touched files
        shell: bash
        working-directory: src
        run: mise exec -- mix format --check-formatted lib/aiur_web/live/experiments_live.ex test/aiur_web/live/experiments_live_test.exs
